[project]
name = "palimpsest-veil"
version = "0.1.0"
description = "Adversarial image protection against AI training — Cloak (style) and Shade (concept) modes."
requires-python = ">=3.9"
readme = "../README.md"
license = { text = "Proprietary — free for personal use only, no modifications or redistribution; see LICENSE" }

[project.scripts]
veil = "veil.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["veil"]
