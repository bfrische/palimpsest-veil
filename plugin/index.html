<!DOCTYPE html>
<html>
<head>
<style>
  /* Sizing/spacing only — colors come from the host theme via Spectrum
     components so all Photoshop themes work untouched. */
  body { margin: 0; }
  #root { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .lbl { opacity: 0.8; }
  .muted { opacity: 0.7; }
  [hidden] { display: none !important; }
  #root sp-picker,
  #root sp-textfield,
  #root sp-slider,
  #root sp-button { width: 100%; }
  .progressWrap {
    width: 100%; height: 6px; border-radius: 3px;
    background: rgba(128,128,128,0.25); overflow: hidden;
  }
  .bar { width: 0%; height: 100%; background: #5b8def; }
  #status { min-height: 14px; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 5px; vertical-align: middle; background: #b04a4a;
  }
  .dot.on { background: #3ba55d; }
</style>
</head>
<body>
  <div id="root">
    <sp-heading size="S">Palimpsest Veil</sp-heading>
    <sp-body size="XS" class="muted">Protect your images from AI training</sp-body>

    <div class="field">
      <sp-body size="XS" class="lbl">Mode</sp-body>
      <sp-picker id="mode" size="M">
        <sp-menu slot="options">
          <sp-menu-item value="cloak" selected>Cloak — hide style</sp-menu-item>
          <sp-menu-item value="shade">Shade — poison concept</sp-menu-item>
        </sp-menu>
      </sp-picker>
    </div>

    <div class="field" id="decoyRow" hidden>
      <sp-body size="XS" class="lbl">Decoy concept</sp-body>
      <sp-textfield id="decoy" placeholder="e.g. stained glass"></sp-textfield>
    </div>

    <div class="field">
      <sp-slider id="strength" min="0" max="100" value="50">
        <sp-label slot="label">Strength</sp-label>
      </sp-slider>
    </div>

    <div class="field">
      <sp-body size="XS" class="lbl">Tier</sp-body>
      <sp-picker id="tier" size="M">
        <sp-menu slot="options">
          <sp-menu-item value="quick" selected>Quick — instant</sp-menu-item>
          <sp-menu-item value="deep">Deep — strong</sp-menu-item>
        </sp-menu>
      </sp-picker>
    </div>

    <sp-button id="run" variant="cta">Protect Image</sp-button>

    <div class="progressWrap"><div id="bar" class="bar"></div></div>
    <sp-body id="status" size="XS" class="muted">Ready.</sp-body>
    <sp-body size="XS" class="muted"><span id="dot" class="dot"></span><span id="engineText">Engine: checking…</span></sp-body>
  </div>

  <script src="src/quick.js"></script>
  <script src="src/bridge.js"></script>
  <script src="src/photoshop.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
